name: Build & Release APK

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 签名：使用固定别名/密码（mengjinghao / meng411722）。
      # - 若仓库 Secrets 中设置了 KEYSTORE_BASE64（一次生成的固定 keystore 的 base64），
      #   则解码复用，保证跨版本「覆盖安装」；否则每次临时生成（不可覆盖安装旧版）。
      # - 生成临时 keystore 时也使用相同的别名与密码，满足指定签名要求。
      - name: Prepare signing keystore
        env:
          STORE_PASS: meng411722
          KEY_PASS: meng411722
          ALIAS: mengjinghao
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/keystore.jks"
            echo "Reused persisted keystore from KEYSTORE_BASE64 secret."
          else
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/keystore.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS" \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=mengjinghao, OU=Dev, O=XiaHong, L=Unknown, ST=Unknown, C=CN"
            echo "Generated temporary keystore (alias=$ALIAS)."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: meng411722
          KEY_ALIAS: mengjinghao
          KEY_PASSWORD: meng411722
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ui-preview ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
