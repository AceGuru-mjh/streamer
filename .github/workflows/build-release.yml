name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 自动生成签名 keystore（无需本地准备）。
      # 如需固定签名以便覆盖安装，可在仓库 Secrets 中设置 KEYSTORE_PASSWORD / KEY_PASSWORD，
      # 并在此改用固定 keystore（见 README 进阶说明）。
      - name: Generate signing keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias xiahong \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=XiaHong, OU=Dev, O=XiaHong, L=Unknown, ST=Unknown, C=CN"

      - name: Build Release APK
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: xiahong
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiahongflow-demo-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: XiaHongFlow Demo ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
